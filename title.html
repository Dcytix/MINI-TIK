<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Game RNG</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; background: #020205; color: white; font-family: 'Arial Black', sans-serif; overflow: hidden; }

        #title-screen {
            position: fixed; width: 100%; height: 100%; display: flex; 
            flex-direction: column; justify-content: center; align-items: center; z-index: 10;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .star-glow {
            position: absolute; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.5) 0%, rgba(0, 212, 255, 0.3) 40%, rgba(0, 0, 0, 0) 70%);
            filter: blur(80px); animation: pulse 4s infinite alternate; z-index: -1;
        }

        .bg-fx {
            position: absolute; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 212, 255, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 80% 70%, rgba(138, 43, 226, 0.05) 0%, transparent 20%);
            z-index: -2;
        }

        h1 {
            font-size: 5rem; letter-spacing: 12px; text-transform: uppercase;
            background: linear-gradient(45deg, #fff, #00d4ff, #8a2be2, #fff);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shine 5s linear infinite; filter: drop-shadow(0 0 15px rgba(255,255,255,0.3));
        }

        #play-btn {
            margin-top: 50px; padding: 20px 100px; font-size: 2rem; background: rgba(255,255,255,0.05);
            color: white; border: 1px solid rgba(255,255,255,0.3); cursor: pointer;
            transition: 0.5s cubic-bezier(0.2, 1, 0.3, 1); backdrop-filter: blur(5px);
            letter-spacing: 5px; font-weight: bold;
        }

        #play-btn:hover {
            background: white; color: black; box-shadow: 0 0 50px white;
            transform: translateY(-5px) scale(1.05); border-color: white;
        }

        #loading-screen {
            position: fixed; width: 100%; height: 100%; background: #000;
            display: none; flex-direction: column; justify-content: center;
            align-items: center; z-index: 20;
        }

        .bar-container { width: 300px; height: 2px; background: #111; position: relative; }
        .bar-fill { height: 100%; width: 0%; background: #00d4ff; box-shadow: 0 0 20px #00d4ff; transition: width 0.1s linear; }

        @keyframes pulse { from { opacity: 0.4; transform: scale(1); } to { opacity: 0.9; transform: scale(1.4); } }
        @keyframes shine { to { background-position: 200% center; } }
        .fade-out { opacity: 0; transform: scale(1.1); pointer-events: none; }
    </style>
</head>
<body>

    <div id="title-screen">
        <div class="star-glow"></div>
        <div class="bg-fx"></div>
        <h1>CARD GAME RNG</h1>
        <button id="play-btn">PLAY</button>
    </div>

    <div id="loading-screen">
        <div class="bar-container"><div class="bar-fill" id="progress"></div></div>
        <p style="margin-top: 20px; letter-spacing: 5px; font-size: 0.7rem; color: #555;">GENERATING RARITIES...</p>
    </div>

    <script>
        const playBtn = document.getElementById('play-btn');
        const title = document.getElementById('title-screen');
        const loader = document.getElementById('loading-screen');
        const bar = document.getElementById('progress');

        playBtn.addEventListener('click', () => {
            title.classList.add('fade-out');
            
            setTimeout(() => {
                title.style.display = 'none';
                loader.style.display = 'flex';
                
                let width = 0;
                const interval = setInterval(() => {
                    if (width >= 100) {
                        clearInterval(interval);
                        window.location.href = 'main.html';
                    } else {
                        width += Math.random() * 15;
                        if (width > 100) width = 100;
                        bar.style.width = width + '%';
                    }
                }, 150);
            }, 800);
        });
    </script>
</body>
</html>
