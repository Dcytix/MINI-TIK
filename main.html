<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Card Game RNG - Collector Edition</title>
    <style>
        :root {
            --common-brd: #ffffff;
            --uncommon-brd: #00ff00;
            --rare-brd: #0000ff;
            --legendary-brd: #ffff00;
            --mythical-brd: #ffa500;
            --secret-brd: #800000;
            --beyond-brd: #000080;
            --apex-brd: linear-gradient(45deg, #808080, #ffa500);
            --predator-brd: linear-gradient(45deg, red, orange, yellow, green, blue, indigo, violet);
            --portugal: linear-gradient(45deg, #ff0000 50%, #008000 50%);

            --mut-Gold: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728);
            --mut-Emerald: linear-gradient(135deg, #50c878, #00ff00, #004d00);
            --mut-Diamond: linear-gradient(135deg, #b9f2ff, #00d4ff, #ffffff);
            --mut-Divine: linear-gradient(135deg, #ffffff, #fff700, #ffffff);
            --mut-Jew: linear-gradient(135deg, #0038b8, #ffffff, #0038b8);
        }

        body.theme-default { background: #050508; --btn-accent: #fff; }
        body.theme-glitch { background: linear-gradient(135deg, #200000, #000000); --btn-accent: #ff0000; }
        body.theme-pastel { background: linear-gradient(135deg, #ffd1dc, #b0e0e6); color: #444; --btn-accent: #ff69b4; }
        body.theme-jew { background: linear-gradient(135deg, #0018a8, #ffffff); --btn-accent: #0018a8; }

        body { margin: 0; color: white; font-family: 'Arial', sans-serif; overflow: hidden; height: 100vh; transition: 0.5s; }
        #main-ui { display: flex; flex-direction: column; height: 100vh; padding: 20px; align-items: center; position: relative; }
        .navbar { width: 100%; display: flex; justify-content: space-between; margin-bottom: 20px; z-index: 100; }
        .nav-left { display: flex; gap: 15px; }

        button { padding: 12px 24px; cursor: pointer; background: rgba(0,0,0,0.3); color: inherit; border: 2px solid var(--btn-accent, #fff); border-radius: 5px; font-weight: bold; transition: 0.3s; }
        button:hover { background: var(--btn-accent, #fff); color: black; }

        #slots-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 10px; }
        .slot { width: 180px; height: 260px; border: 2px dashed rgba(255,255,255,0.1); border-radius: 15px; display: flex; align-items: center; justify-content: center; }

        .card-border-wrap { padding: 4px; border-radius: 12px; height: 250px; width: 170px; box-sizing: border-box; }
        .card { height: 100%; border-radius: 10px; background: #111; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #222; }
        
        .brd-Common { background: var(--common-brd); }
        .brd-Uncommon { background: var(--uncommon-brd); }
        .brd-Rare { background: var(--rare-brd); }
        .brd-Legendary { background: var(--legendary-brd); }
        .brd-Mythical { background: var(--mythical-brd); }
        .brd-Secret { background: var(--secret-brd); }
        .brd-Beyond { background: var(--beyond-brd); }
        .brd-Apex { background: var(--apex-brd); }
        .brd-Predator { background: var(--predator-brd); }
        .brd-GOAT { background: var(--portugal); }

        .card-img-container { width: 100%; height: 130px; background: #000; border-bottom: 2px solid #333; }
        .card img { width: 100%; height: 100%; object-fit: contain; }
        .card-info { flex-grow: 1; padding: 8px; text-align: center; }
        .card-name { font-size: 11px; font-weight: 900; height: 30px; margin-bottom: 2px; }
        .card-rarity-val { font-size: 9px; color: #888; margin-bottom: 5px; }
        .card-income { color: #0f0; font-size: 11px; font-weight: bold; border-top: 1px dotted #444; padding-top: 4px; }

        .window { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; height: 85%; background: #08080a; border: 2px solid #333; z-index: 1000; display: none; border-radius: 20px; padding: 25px; box-shadow: 0 0 50px black; }
        .win-close { position: absolute; top: 15px; right: 20px; font-size: 30px; cursor: pointer; color: red; }

        #inv-main { display: flex; gap: 20px; height: 90%; }
        #inv-scroll { flex: 3; display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); grid-auto-rows: 80px; gap: 10px; overflow-y: auto; padding: 15px; background: #000; border-radius: 10px; }
        .inv-item { aspect-ratio: 1/1; background: #1a1a1a; border: 1px solid #444; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: grab; text-align: center; font-size: 8px; padding: 5px; overflow: hidden; }
        .equipped-shadow { opacity: 0.2; border: 1px solid #0f0; }

        .stats-left { position: fixed; bottom: 30px; left: 30px; line-height: 1.6; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 10px; }
        .stats-right { position: fixed; bottom: 30px; right: 30px; text-align: right; }

        #gacha-notify { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); padding: 15px 30px; background: rgba(0,0,0,0.9); border: 2px solid gold; border-radius: 10px; z-index: 5000; display: none; font-weight: bold; text-align: center; pointer-events: none; }
        .fade-out { animation: fadeOut 2.5s forwards; }
        @keyframes fadeOut { 0% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -20px); } }

        #pack-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; overflow-y: auto; height: 85%; padding: 10px; }
        .pack-box { padding: 15px; border-radius: 10px; cursor: pointer; text-align: center; color: black; font-weight: bold; border: 2px solid gold; transition: 0.2s; display: flex; flex-direction: column; justify-content: center; }
        .pack-box:hover { transform: scale(1.03); }
    </style>
</head>
<body onload="init()">

    <div id="gacha-notify"></div>

    <div id="goat-cinematic" style="position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:9999; display:none; align-items:center; justify-content:center; flex-direction:column;">
        <h1 style="color:white; font-size: 5rem; z-index: 10; text-shadow: 0 0 20px red;">SIUUUUUU!</h1>
    </div>

    <div id="main-ui">
        <div class="navbar">
            <div class="nav-left">
                <button onclick="openWin('upgrade-win')">SHOP</button>
                <button onclick="openWin('gacha-win')">GACHA</button>
                <button onclick="openWin('inv-win')">COLLECTION</button>
            </div>
            <button id="signup-btn" onclick="openWin('form-win')" style="border-color: gold; color: gold;">MEMBERSHIP</button>
        </div>

        <div id="slots-grid">
            <div class="slot" id="s0"></div><div class="slot" id="s1"></div>
            <div class="slot" id="s2"></div><div class="slot" id="s3"></div>
            <div class="slot" id="s4"></div><div class="slot" id="s5"></div>
            <div class="slot" id="s6"></div><div class="slot" id="s7"></div>
        </div>

        <div class="stats-left">
            LUCK: <span id="val-luck" style="color: gold;">1.0x</span><br>
            MEMBER BOOST: <span id="val-mult" style="color: cyan;">1.0x</span>
        </div>

        <div class="stats-right">
            <div style="font-size: 3rem; color: #0f0; font-weight: 900;">$<span id="val-cash">0</span></div>
            <div style="opacity: 0.7;">$<span id="val-cps">0</span> / sec</div>
        </div>
    </div>

    <div id="inv-win" class="window">
        <span class="win-close" onclick="closeWin('inv-win')">×</span>
        <h2>CARD INVENTORY</h2>
        <div id="inv-main">
            <div id="inv-scroll"></div>
            <div style="flex:1; background:#111; padding:15px; border-radius:10px;">
                <h3 style="text-align:center; font-size: 0.9rem;">EQUIPPED</h3>

            </div>
        </div>
    </div>

    <div id="gacha-win" class="window">
        <span class="win-close" onclick="closeWin('gacha-win')">×</span>
        <h2 style="text-align:center">GACHA PACKS</h2>
        <div id="pack-grid"></div>
    </div>

    <div id="upgrade-win" class="window">
        <span class="win-close" onclick="closeWin('upgrade-win')">×</span>
        <h2 style="text-align:center">UPGRADES</h2>
        <div style="display:flex; justify-content:center; gap:40px; margin-top:50px;">
            <div style="background:#151515; padding:30px; border-radius:15px; width:220px; text-align:center; border:1px solid #333;">
                <h3>LUCK BOOST</h3>
                <p id="cost-luck" style="color:gold">$100</p>
                <button onclick="buyBoost('luck')" style="width:100%; margin-top:10px;">UPGRADE</button>
            </div>
            <div style="background:#151515; padding:30px; border-radius:15px; width:220px; text-align:center; border:1px solid #333;">
                <h3>MONEY BOOST</h3>
                <p id="cost-money" style="color:gold">$100</p>
                <button onclick="buyBoost('money')" style="width:100%; margin-top:10px;">UPGRADE</button>
            </div>
        </div>
    </div>

    <div id="form-win" class="window">
        <span class="win-close" onclick="closeWin('form-win')">×</span>
        <iframe src="forms.html" style="width:100%; height:100%; border:none; border-radius:15px;"></iframe>
    </div>

            {n:"Benjamin Netanyahu", r:"Beyond", rate:2000000, c:2000000, img:"https://upload.wikimedia.org/wikipedia/commons/thumb/7/74/Benjamin_Netanyahu%2C_February_2023.jpg/960px-Benjamin_Netanyahu%2C_February_2023.jpg"},

            {n:"Sukuna", r:"Apex", rate:5000000, c:5000000, img:"https://pict.sindonews.net/dyn/850/pena/news/2024/09/26/700/1463085/10-karakter-jujutsu-kaisen-yang-tewas-dibunuh-sukuna-siapa-saja-hzm.jpg"},
            {n:"Fine Shyt 2", r:"Apex", rate:7500000, c:7500000, img:"https://i.pinimg.com/474x/e3/cb/3d/e3cb3def24d7af5e129a37e8db7f23ae.jpg"},
            {n:"Michael Ferdinand", r:"Apex", rate:10000000, c:20000000, img:"https://static.honestdocs.id/system/blog_articles/main_hero_images/000/006/557/original/iStock-178496494_(1).jpg"},
            {n:"AEIOU", r:"Apex", rate:15000000, c:30000000, img:"https://kidspressmagazine.com/t500/10249/10256/vowels-flashcard-set-aeiou.png"},
            {n:"Chainsaw Man", r:"Apex", rate:30000000, c:50000000, img:"https://upload.wikimedia.org/wikipedia/en/thumb/2/24/Chainsawman.jpg/250px-Chainsawman.jpg"},
            {n:"Jeffrey Epstein", r:"Predator", rate:50000000, c:100000000, img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQy1rZ2987WPeeOexcR7CUv4pCDCHpjOlJi5A&s"},
            {n:"Cristiano Ronaldo", r:"GOAT", rate:999999999, c:999999999, img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSA2J2tD1N8jrura9S_Re8Jps0i5Z_--z6QdQ&s"}
        ];

        const MUTATIONS = [
            {n:"Gold", ch: 0.1, m: 2, c: "gold", css: "var(--mut-Gold)"},
            {n:"Emerald", ch: 0.001, m: 4, c: "#00ff00", css: "var(--mut-Emerald)"},
            {n:"Diamond", ch: 0.00001, m: 8, c: "#b9f2ff", css: "var(--mut-Diamond)"},
            {n:"Divine", ch: 1e-7, m: 16, c: "#fff700", css: "var(--mut-Divine)"},
            {n:"Jew", ch: 1e-9, m: 50, c: "#0038b8", css: "var(--mut-Jew)"}
        ];

        let state = { cash: 10, luckLvl: 0, moneyLvl: 0, inventory: [], equippedIds: Array(8).fill(null), member: { luckBoost: 1, moneyBoost: 1, theme: 'default', isMember: false } };

        function init() { checkMemberStatus(); renderPacks(); renderInv(); renderBoard(); setInterval(gameLoop, 1000); }

        function checkMemberStatus() {
            document.body.className = "theme-default";
            let data = localStorage.getItem('cardGameUser');
            if(data) {
                state.member = JSON.parse(data);
                document.body.className = "theme-" + state.member.theme;
                if(state.member.isMember) {
                    let b = document.getElementById('signup-btn');
                    b.innerHTML = "MEMBER ACTIVE ✅"; b.style.borderColor = "cyan"; b.style.color = "cyan";
                }
            }
        }

        function gameLoop() {
            checkMemberStatus();
            let total = 0;
            state.equippedIds.forEach(id => {
                let c = state.inventory.find(i => i.id === id);
                if(c) total += c.c * (c.mut ? c.mut.m : 1);
            });
            let finalCps = total * (1 + state.moneyLvl * 0.1) * state.member.moneyBoost;
            state.cash += finalCps;
            document.getElementById('val-cash').innerText = Math.floor(state.cash).toLocaleString();
            document.getElementById('val-cps').innerText = Math.floor(finalCps).toLocaleString();
            document.getElementById('val-luck').innerText = ((1 + state.luckLvl * 0.1) * state.member.luckBoost).toFixed(1) + "x";
            document.getElementById('val-mult').innerText = (state.member.moneyBoost).toFixed(1) + "x";
        }

        function renderPacks() {
            const grid = document.getElementById('pack-grid'); grid.innerHTML = '';
            const cfgs = [
                {n:"Pack #1", l:1, bg:"#fff"}, {n:"Pack #2", l:10, bg:"linear-gradient(#0f0, #040)"}, {n:"Pack #3", l:100, bg:"linear-gradient(#00f, #004)"},
                {n:"Pack #4", l:1000, bg:"linear-gradient(#ff0, #440)"}, {n:"Pack #5", l:10000, bg:"linear-gradient(#f00, #400)"},
                {n:"Pack #6", l:100000, bg:"linear-gradient(#f0f, #404)"}, {n:"Pack #7", l:1e6, bg:"linear-gradient(#ccc, #444)"},
                {n:"Pack #8", l:1e7, bg:"var(--predator-brd)"}, {n:"Pack #9", l:1e8, bg:"var(--mut-Gold)"}, {n:"Pack #10", l:1e9, bg:"var(--portugal)"}
            ];
            cfgs.forEach((p, i) => {
                let cost = 10 * Math.pow(100, i);
                let d = document.createElement('div'); d.className = 'pack-box'; d.style.background = p.bg;
                d.innerHTML = `<h3>${p.n}</h3>x${p.l.toLocaleString()} Luck<br>$${cost.toLocaleString()}`;
                d.onclick = () => buyPack(cost, p.l);
                grid.appendChild(d);
            });
        }

        function buyPack(cost, luck) {
            if(state.cash < cost) return;
            state.cash -= cost;
            let finalLuck = luck * (1 + state.luckLvl * 0.1) * state.member.luckBoost;
            let rolled = CARDS[0];
            for(let i = CARDS.length-1; i>=0; i--) { if(Math.random() < (1 / (CARDS[i].rate / finalLuck))) { rolled = CARDS[i]; break; } }
            if(rolled.r === "GOAT") return playGoatAnim(rolled);
            let mut = null;
            for(let m of MUTATIONS) { if(Math.random() < m.ch) { mut = m; break; } }
            let key = rolled.n + (mut?mut.n:"");
            if(state.inventory.find(i => i.uKey === key)) {
                state.cash += cost/2; notify(`DUPE: ${rolled.n} sold!`, "white");
            } else {
                state.inventory.push({...rolled, mut: mut, id: Math.random(), uKey: key});
                notify(`You have obtained ${mut?`<span style="color:${mut.c}">${mut.n}</span> `:''}${rolled.n}!`, mut?mut.c:"gold");
                renderInv();
            }
        }

        function notify(txt, color) {
            const el = document.getElementById('gacha-notify'); el.innerHTML = txt; el.style.borderColor = color;
            el.style.display = 'block'; el.classList.remove('fade-out'); void el.offsetWidth; el.classList.add('fade-out');
            setTimeout(() => { el.style.display = 'none'; }, 2500);
        }

        function playGoatAnim(c) {
            const sc = document.getElementById('goat-cinematic'); sc.style.display = 'flex';
            setTimeout(() => {
                sc.style.display = 'none';
                state.inventory.push({...c, id: Math.random(), uKey: "CR7-GOAT"});
                renderInv();
            }, 3000);
        }

        function renderInv() {
            const list = document.getElementById('inv-scroll'); list.innerHTML = '';
            state.inventory.forEach(item => {
                let isEq = state.equippedIds.includes(item.id);
                let d = document.createElement('div'); d.className = `inv-item ${isEq ? 'equipped-shadow' : ''}`;
                d.innerHTML = `<b>${item.n}</b><br>${item.mut?item.mut.n:item.r}`;
                if(!isEq) { d.draggable = true; d.ondragstart = (e) => e.dataTransfer.setData("cid", item.id); }
                list.appendChild(d);
            });
            const eq = document.getElementById('eq-slots-list'); eq.innerHTML = '';
            for(let i=0; i<8; i++) {
                let c = state.inventory.find(x => x.id === state.equippedIds[i]);
                let d = document.createElement('div'); d.style = "height:35px; border:1px solid #444; background:#000; border-radius:5px; padding:0 10px; display:flex; align-items:center; cursor:pointer; font-size:11px";
                d.innerHTML = c ? `[${i+1}] ${c.n}` : `SLOT ${i+1}`;
                d.onclick = () => { state.equippedIds[i] = null; renderInv(); renderBoard(); };
                d.ondragover = (e) => e.preventDefault();
                d.ondrop = (e) => { let id = parseFloat(e.dataTransfer.getData("cid")); if(!state.equippedIds.includes(id)) { state.equippedIds[i] = id; renderInv(); renderBoard(); } };
                eq.appendChild(d);
            }
        }

        function renderBoard() {
            for(let i=0; i<8; i++) {
                const el = document.getElementById('s' + i); el.innerHTML = '';
                let c = state.inventory.find(x => x.id === state.equippedIds[i]);
                if(c) {
                    el.innerHTML = `
                        <div class="card-border-wrap brd-${c.r}">
                            <div class="card" style="background:${c.mut ? c.mut.css : '#111'}">
                                <div class="card-img-container"><img src="${c.img}"></div>
                                <div class="card-info">
                                    <div class="card-name">${c.mut?c.mut.n+' ':''}${c.n}</div>
                                    <div class="card-rarity-val">1/${c.rate.toLocaleString()}</div>
                                    <div class="card-income">$${(c.c*(c.mut?c.mut.m:1)).toLocaleString()}/s</div>
                                </div>
                            </div>
                        </div>`;
                }
            }
        }

        function buyBoost(t) {
            let cost = 100 * Math.pow(10, t==='luck'?state.luckLvl:state.moneyLvl);
            if(state.cash < cost) return;
            state.cash -= cost;
            if(t==='luck') state.luckLvl++; else state.moneyLvl++;
            document.getElementById('cost-'+t).innerText = "$" + (100 * Math.pow(10, t==='luck'?state.luckLvl:state.moneyLvl)).toLocaleString();
        }

        function openWin(id) { document.getElementById(id).style.display = 'block'; }
        function closeWin(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
